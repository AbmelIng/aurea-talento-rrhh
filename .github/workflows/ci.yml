name: Verificación del proyecto

on:
  push:
    branches:
      - main
      - cloud/despliegue
  pull_request:
    branches:
      - main
      - cloud/despliegue
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · compilación y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar y ejecutar pruebas
        run: npm test

  web:
    name: Angular · pruebas y compilación
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test -- --watch=false
      - name: Compilar versión de producción
        run: npm run build

  mysql:
    name: MySQL · migraciones y recorrido principal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: aurea_ci
          MYSQL_USER: aurea_ci
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest-only-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: api
    env:
      DB_DRIVER: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: aurea_ci
      MYSQL_PASSWORD: test-only-password
      MYSQL_DATABASE: aurea_ci
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Probar MySQL
        run: npm run test:mysql

  compose:
    name: Docker Compose · API y MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MYSQL_PASSWORD: integration-only-password
      MYSQL_ROOT_PASSWORD: integration-only-root-password
      APP_SECRET: integration-only-secret-at-least-32-characters
      WEB_ORIGIN: http://localhost:4201
      API_PORT: '3001'
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Construir e iniciar servicios
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Comprobar API y base de datos
        run: curl --fail --silent --show-error http://127.0.0.1:3001/api/health
      - name: Mostrar diagnóstico si falla
        if: failure()
        run: docker compose logs --tail=100 api mysql
      - name: Retirar contenedores de prueba
        if: always()
        run: docker compose down --volumes
